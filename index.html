<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة برامج حكيم - Hakim Ecosystem</title>
    <meta name="description" content="منظومة برامج تعليمية وإدارية احترافية من تطوير حكيم بوزورداز">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="data.js"></script>
    <style>
        :root {
            /* Material Design 3 - Light Theme */
            --md-sys-color-primary: #0061a4;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #d1e4ff;
            --md-sys-color-on-primary-container: #001d36;
            
            --md-sys-color-secondary-container: #d7e3f7;
            --md-sys-color-on-secondary-container: #101c2b;
            
            --md-sys-color-surface: #fdfcff;
            --md-sys-color-on-surface: #1a1c1e;
            --md-sys-color-on-surface-variant: #43474e;
            
            --md-sys-color-surface-container-lowest: #ffffff;
            --md-sys-color-surface-container-low: #f4f3f7;
            --md-sys-color-surface-container: #eeedf2;
            --md-sys-color-surface-container-high: #e8e8ed;
            --md-sys-color-surface-container-highest: #e2e2e6;
            
            --md-sys-color-outline: #73777f;
            --md-sys-color-outline-variant: #c3c7cf;
            
            --md-elevation-1: 0px 1px 2px 0px rgba(0,0,0,0.3), 0px 1px 3px 1px rgba(0,0,0,0.15);
            --md-elevation-2: 0px 1px 2px 0px rgba(0,0,0,0.3), 0px 2px 6px 2px rgba(0,0,0,0.15);
        }

        .dark {
            /* Material Design 3 - Dark Theme */
            --md-sys-color-primary: #9ecaef;
            --md-sys-color-on-primary: #003258;
            --md-sys-color-primary-container: #00497d;
            --md-sys-color-on-primary-container: #d1e4ff;
            
            --md-sys-color-secondary-container: #3d4a58;
            --md-sys-color-on-secondary-container: #d7e3f7;
            
            --md-sys-color-surface: #1a1c1e;
            --md-sys-color-on-surface: #e2e2e6;
            --md-sys-color-on-surface-variant: #c3c7cf;
            
            --md-sys-color-surface-container-lowest: #0d0f11;
            --md-sys-color-surface-container-low: #1a1c1e;
            --md-sys-color-surface-container: #1e2022;
            --md-sys-color-surface-container-high: #282a2d;
            --md-sys-color-surface-container-highest: #333538;
            
            --md-sys-color-outline: #8d9199;
            --md-sys-color-outline-variant: #43474e;
            
            --md-elevation-1: 0px 1px 3px 1px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.3);
            --md-elevation-2: 0px 2px 6px 2px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rubik', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* LTR adjustments */
        html[dir="ltr"] .title-text { margin-right: 0; margin-left: 8px; }
        html[dir="ltr"] .search-container { transform-origin: top left; }

        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* ===== M3 TOP APP BAR ===== */
        .top-app-bar {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        .top-app-bar.scrolled {
            background-color: var(--md-sys-color-surface-container-high);
            box-shadow: var(--md-elevation-2);
        }

        .app-bar-start, .app-bar-end {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button {
            background: transparent;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .icon-button:hover {
            background-color: var(--md-sys-color-surface-container-highest);
        }

        .title-text {
            font-size: 18px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            margin-right: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        /* ===== M3 MAIN LAYOUT ===== */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px;
            width: 100%;
            flex: 1;
        }

        /* ===== M3 SEARCH BAR ===== */
        .search-container {
            display: none;
            margin-bottom: 24px;
            animation: expandSearch 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
            transform-origin: top;
        }
        .search-container.active {
            display: block;
        }
        @keyframes expandSearch {
            from { opacity: 0; transform: scaleY(0); }
            to { opacity: 1; transform: scaleY(1); }
        }

        .search-bar {
            display: flex;
            align-items: center;
            background-color: var(--md-sys-color-surface-container-high);
            border-radius: 28px;
            height: 56px;
            padding: 0 16px;
            gap: 16px;
            transition: background-color 0.2s ease;
        }
        .search-bar:focus-within {
            background-color: var(--md-sys-color-surface-container-highest);
        }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            color: var(--md-sys-color-on-surface);
            font-family: inherit;
        }
        .search-bar input::placeholder {
            color: var(--md-sys-color-on-surface-variant);
        }

        /* ===== M3 FILTER CHIPS (TABS) ===== */
        .chip-group {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 24px;
            scrollbar-width: none;
        }
        .chip-group::-webkit-scrollbar { display: none; }

        .filter-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 36px;
            padding: 0 16px;
            border-radius: 8px;
            border: 1px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface-container-lowest);
            color: var(--md-sys-color-on-surface-variant);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .filter-chip:hover {
            background-color: var(--md-sys-color-surface-container-high);
        }
        .filter-chip.active {
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            border-color: transparent;
        }
        .chip-icon {
            display: none;
            font-size: 18px;
        }
        .filter-chip.active .chip-icon {
            display: block;
        }

        /* ===== M3 ENHANCED CARDS ===== */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .m3-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            background-color: var(--md-sys-color-surface-container-low);
            border-radius: 16px;
            padding: 16px;
            gap: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--md-sys-color-outline-variant);
        }
        .m3-card:hover {
            background-color: var(--md-sys-color-surface-container-high);
            box-shadow: var(--md-elevation-1);
            border-color: var(--md-sys-color-outline);
            transform: translateY(-2px);
        }
        .m3-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background-color: var(--md-sys-color-on-surface);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .m3-card:active::after { opacity: 0.1; }

        .card-thumbnail {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
            padding: 12px;
            transition: transform 0.3s ease;
        }
        .m3-card:hover .card-thumbnail {
            transform: scale(1.05);
        }
        .card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
            z-index: 2;
        }
        .fallback-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        .fallback-icon {
            font-size: 32px !important;
            color: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .card-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            min-width: 0;
            gap: 6px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-badge {
            font-size: 11px;
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            padding: 2px 8px;
            border-radius: 6px;
            width: fit-content;
            font-weight: 500;
        }
        .card-subtitle {
            font-size: 13px;
            color: var(--md-sys-color-on-surface-variant);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .card-subtitle-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }
        .card-subtitle-item i, .card-subtitle-item span.material-symbols-rounded {
            font-size: 14px;
            color: var(--md-sys-color-primary);
        }

        .card-action {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--md-sys-color-surface-container-highest);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--md-sys-color-on-surface-variant);
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .card-action span {
            font-size: 20px;
        }
        .m3-card:hover .card-action {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            transform: scale(1.1);
        }

        /* ===== M3 DETAIL VIEW ===== */
        #detailView {
            display: none;
            animation: fadeTransition 0.3s ease;
        }
        #detailView.active {
            display: block;
        }

        .m3-fab-extended {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 56px;
            padding: 0 24px 0 20px;
            border-radius: 16px;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--md-elevation-1);
            transition: box-shadow 0.2s, background-color 0.2s, transform 0.2s;
            text-decoration: none;
        }
        .m3-fab-extended:hover {
            box-shadow: var(--md-elevation-2);
            background-color: color-mix(in srgb, var(--md-sys-color-primary-container) 92%, var(--md-sys-color-on-primary-container));
            transform: translateY(-2px);
        }

        .detail-header-surface {
            background-color: var(--md-sys-color-surface-container-low);
            border-radius: 28px;
            padding: 40px 32px;
            margin-bottom: 24px;
            display: flex;
            gap: 32px;
            align-items: center;
            border: 1px solid var(--md-sys-color-outline-variant);
            box-shadow: var(--md-elevation-1);
        }

        .detail-icon-large {
            width: 140px;
            height: 140px;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            padding: 20px;
        }
        .detail-icon-large img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
            z-index: 2;
        }
        .detail-icon-large .fallback-icon {
            font-size: 64px !important;
            color: #ffffff;
            z-index: 2;
        }

        .detail-info-block {
            flex: 1;
        }
        .detail-title-text {
            font-size: 36px;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            margin-bottom: 12px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        .detail-dev-text {
            font-size: 15px;
            color: var(--md-sys-color-primary);
            font-weight: 600;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .detail-stats-row {
            display: flex;
            gap: 32px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .stat-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }
        .stat-text {
            display: flex;
            flex-direction: column;
        }
        .stat-val {
            font-weight: 700;
            font-size: 16px;
            color: var(--md-sys-color-on-surface);
        }
        .stat-lbl {
            font-size: 13px;
            color: var(--md-sys-color-on-surface-variant);
        }

        .m3-surface-card {
            background-color: var(--md-sys-color-surface-container-low);
            border-radius: 28px;
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        .m3-headline {
            font-size: 20px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .m3-body-text {
            font-size: 16px;
            line-height: 1.8;
            color: var(--md-sys-color-on-surface-variant);
        }

        .m3-list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }
        .m3-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
        }
        .m3-list-item:last-child {
            border-bottom: none;
        }
        .m3-list-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
        }
        .m3-list-secondary-text {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
        }

        .m3-features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .m3-feature-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background-color: var(--md-sys-color-surface-container-highest);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            transition: transform 0.2s;
        }
        .m3-feature-chip:hover {
            transform: translateX(-4px);
        }
        html[dir="ltr"] .m3-feature-chip:hover {
            transform: translateX(4px);
        }
        .m3-feature-chip .material-symbols-rounded {
            color: #10b981;
            font-size: 22px;
        }

        /* ===== M3 FOOTER ===== */
        .m3-footer {
            background-color: var(--md-sys-color-surface-container-low);
            color: var(--md-sys-color-on-surface-variant);
            padding: 24px 16px;
            text-align: center;
            font-size: 14px;
            border-top: 1px solid var(--md-sys-color-outline-variant);
            margin-top: auto;
        }

        @media(max-width: 768px) {
            .detail-header-surface {
                flex-direction: column;
                text-align: center;
                align-items: center;
                padding: 32px 20px;
            }
            .detail-stats-row {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- M3 Top App Bar -->
    <header class="top-app-bar" id="topAppBar">
        <div class="app-bar-start">
            <button class="icon-button" onclick="showHome()"><span class="material-symbols-rounded">menu</span></button>
            <a href="#" class="title-text" onclick="showHome(); return false;">
                <span class="material-symbols-rounded icon-filled" style="color: var(--md-sys-color-primary);">category</span>
                <span data-i18n="appTitle">مكتبة البرامج</span>
            </a>
        </div>
        <div class="app-bar-end">
            <button class="icon-button" onclick="toggleSearch()" title="Search/بحث"><span class="material-symbols-rounded">search</span></button>
            <button class="icon-button" onclick="toggleLanguage()" title="تغيير اللغة / Change Language"><span class="material-symbols-rounded">translate</span></button>
            <button class="icon-button" onclick="toggleTheme()" title="Dark/Light"><span class="material-symbols-rounded" id="themeIcon">dark_mode</span></button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        
        <!-- M3 Search Bar -->
        <div class="search-container" id="searchContainer">
            <div class="search-bar">
                <span class="material-symbols-rounded" style="color: var(--md-sys-color-on-surface-variant);">search</span>
                <input type="text" id="searchInput" placeholder="ابحث في البرامج..." data-i18n-placeholder="searchPlaceholder" oninput="filterApps()">
            </div>
        </div>

        <!-- ============ HOME VIEW ============ -->
        <div id="homeView">
            <!-- M3 Filter Chips -->
            <div class="chip-group" id="filterTabs"></div>

            <!-- Grid -->
            <div class="grid-layout" id="appsGrid"></div>
        </div>

        <!-- ============ DETAIL VIEW ============ -->
        <div id="detailView">
            <div style="margin-bottom: 24px;">
                <button class="icon-button" onclick="showHome()" style="background-color: var(--md-sys-color-surface-container-high); border-radius: 50%;">
                    <span class="material-symbols-rounded" id="backIcon">arrow_forward</span>
                </button>
            </div>

            <div class="detail-header-surface">
                <!-- Icon with Gradient Background -->
                <div class="detail-icon-large" id="detailIcon"></div>
                
                <div class="detail-info-block">
                    <h1 class="detail-title-text" id="detailTitle"></h1>
                    <div class="detail-dev-text">
                        <span class="material-symbols-rounded" style="font-size: 18px;">verified</span> 
                        <span data-i18n="developerName">Hakim BOUZOURDAZ</span>
                    </div>
                    
                    <div class="detail-stats-row">
                        <div class="stat-item">
                            <div class="stat-icon"><span class="material-symbols-rounded">download</span></div>
                            <div class="stat-text">
                                <span class="stat-val" id="detailDownloads"></span>
                                <span class="stat-lbl" data-i18n="downloads">التحميلات</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-icon"><span class="material-symbols-rounded">folder</span></div>
                            <div class="stat-text">
                                <span class="stat-val" id="detailSize"></span>
                                <span class="stat-lbl" data-i18n="size">حجم الملف</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-icon"><span class="material-symbols-rounded">tag</span></div>
                            <div class="stat-text">
                                <span class="stat-val" id="detailVersion"></span>
                                <span class="stat-lbl" data-i18n="version">الإصدار</span>
                            </div>
                        </div>
                    </div>
                    
                    <button class="m3-fab-extended" id="downloadBtn" onclick="downloadApp()">
                        <span class="material-symbols-rounded icon-filled">download</span>
                        <span data-i18n="downloadBtn">تحميل النسخة الأخيرة</span>
                    </button>
                </div>
            </div>

            <div class="grid-layout" style="grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 24px;">
                <div class="m3-surface-card">
                    <h2 class="m3-headline">
                        <span class="material-symbols-rounded" style="color:var(--md-sys-color-primary)">info</span> 
                        <span data-i18n="overview">نظرة عامة</span>
                    </h2>
                    <p class="m3-body-text" id="detailDesc"></p>
                    
                    <h2 class="m3-headline" style="margin-top: 32px;">
                        <span class="material-symbols-rounded" style="color:var(--md-sys-color-primary)">star</span> 
                        <span data-i18n="features">المميزات</span>
                    </h2>
                    <div class="m3-features-grid" id="featureList"></div>
                </div>
                
                <div class="m3-surface-card">
                    <h2 class="m3-headline">
                        <span class="material-symbols-rounded" style="color:var(--md-sys-color-primary)">list_alt</span> 
                        <span data-i18n="techSpecs">معلومات تقنية</span>
                    </h2>
                    <ul class="m3-list">
                        <li class="m3-list-item">
                            <span class="m3-list-secondary-text" data-i18n="category">التصنيف</span>
                            <span class="m3-list-text" id="infoCategory"></span>
                        </li>
                        <li class="m3-list-item">
                            <span class="m3-list-secondary-text" data-i18n="version">رقم الإصدار</span>
                            <span class="m3-list-text" id="infoVersion" style="color: var(--md-sys-color-primary);"></span>
                        </li>
                        <li class="m3-list-item">
                            <span class="m3-list-secondary-text" data-i18n="size">حجم التحميل</span>
                            <span class="m3-list-text" id="infoSize"></span>
                        </li>
                        <li class="m3-list-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                            <span class="m3-list-secondary-text" data-i18n="fileName">اسم الملف الاصلي</span>
                            <span class="m3-list-text" id="infoFileName" style="direction: ltr; font-size: 14px; word-break: break-all;"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <!-- M3 Footer -->
    <footer class="m3-footer">
        <div class="footer-content">
            <span data-i18n="footerText">© 2026 مكتبة البرامج - جميع الحقوق محفوظة للمطور حكيم بوزورداز.</span>
        </div>
    </footer>

    <script>
        let currentApp = null;
        let currentLang = 'ar'; // Default language

        const defaultIconSymbol = '<span class="material-symbols-rounded fallback-icon">apps</span>';

        const i18n = {
            ar: {
                appTitle: "مكتبة البرامج",
                searchPlaceholder: "ابحث في البرامج...",
                noResults: "لا توجد نتائج",
                downloads: "التحميلات",
                size: "حجم الملف",
                version: "الإصدار",
                overview: "نظرة عامة",
                features: "المميزات",
                techSpecs: "معلومات تقنية",
                category: "التصنيف",
                fileName: "اسم الملف الاصلي",
                developerName: "Hakim BOUZOURDAZ",
                downloadBtn: "تحميل النسخة الأخيرة",
                backIcon: "arrow_forward",
                footerText: "© 2026 مكتبة البرامج - جميع الحقوق محفوظة للمطور حكيم بوزورداز."
            },
            en: {
                appTitle: "Software Library",
                searchPlaceholder: "Search apps...",
                noResults: "No results found",
                downloads: "Downloads",
                size: "File Size",
                version: "Version",
                overview: "Overview",
                features: "Key Features",
                techSpecs: "Technical Info",
                category: "Category",
                fileName: "Original Filename",
                developerName: "Hakim BOUZOURDAZ",
                downloadBtn: "Download Latest Version",
                backIcon: "arrow_back",
                footerText: "© 2026 Software Library - All rights reserved by Hakim BOUZOURDAZ."
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            updateTranslations();
            renderTabs();
            renderApps(appsData);
            
            // Top App Bar Scroll Effect
            window.addEventListener('scroll', () => {
                const appBar = document.getElementById('topAppBar');
                if (window.scrollY > 10) {
                    appBar.classList.add('scrolled');
                } else {
                    appBar.classList.remove('scrolled');
                }
            });

            // Check Hash
            if(window.location.hash && window.location.hash.startsWith('#app-')) {
                const id = parseInt(window.location.hash.replace('#app-', ''));
                if(id) showDetail(id);
            }
        });

        // --- Translation & Language Toggle ---
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;
            
            updateTranslations();
            renderTabs();
            filterApps(); // Re-render grid to update text
            if(currentApp) showDetail(currentApp.id); // Re-render detail if open
        }

        function updateTranslations() {
            const dict = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dict[key]) el.placeholder = dict[key];
            });
            
            // Update back icon direction
            document.getElementById('backIcon').textContent = dict.backIcon;
        }

        // --- Theme Toggle ---
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.textContent = 'light_mode';
            } else {
                html.classList.add('dark');
                icon.textContent = 'dark_mode';
            }
        }

        // --- Search Toggle ---
        function toggleSearch() {
            const container = document.getElementById('searchContainer');
            container.classList.toggle('active');
            if(container.classList.contains('active')) {
                document.getElementById('searchInput').focus();
            }
        }

        // --- Tabs ---
        function renderTabs() {
            const tabsContainer = document.getElementById('filterTabs');
            tabsContainer.innerHTML = categories.map((cat, i) => {
                const catName = currentLang === 'ar' ? cat.ar : cat.en;
                return `
                <button class="filter-chip ${i === 0 ? 'active' : ''}" onclick="setFilter('${catName}', this, '${cat.en}')">
                    <span class="material-symbols-rounded icon-filled chip-icon">check</span>
                    ${catName}
                </button>
                `;
            }).join('');
        }

        function setFilter(catName, btn, catEnOriginal) {
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            // Store the filter value
            btn.dataset.filterValue = catEnOriginal; 
            filterApps();
        }

        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const activeTab = document.querySelector('.filter-chip.active');
            
            // We use English category as the base filter reference
            const filterValue = activeTab ? (activeTab.dataset.filterValue || 'All') : 'All';

            let filtered = appsData;
            if (filterValue !== 'All') {
                filtered = filtered.filter(a => a.categoryEn === filterValue);
            }
            if (query) {
                filtered = filtered.filter(a => 
                    (a.nameAr && a.nameAr.toLowerCase().includes(query)) || 
                    (a.name && a.name.toLowerCase().includes(query)) ||
                    (a.description && a.description.toLowerCase().includes(query)) ||
                    (a.descriptionEn && a.descriptionEn.toLowerCase().includes(query))
                );
            }
            renderApps(filtered);
        }

        // --- Render Cards ---
        function renderApps(apps) {
            const grid = document.getElementById('appsGrid');
            if (apps.length === 0) {
                const noResultsText = i18n[currentLang].noResults;
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align:center; padding: 48px; color: var(--md-sys-color-on-surface-variant);">
                        <span class="material-symbols-rounded" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;">search_off</span>
                        <div style="font-size: 18px; font-weight: 500;">${noResultsText}</div>
                    </div>`;
                return;
            }

            grid.innerHTML = apps.map(app => {
                let iconContent = '';
                if (app.icon && app.icon !== 'default') {
                    iconContent = `
                        <img src="${app.icon}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="fallback-container" style="display:none;">${defaultIconSymbol}</div>
                    `;
                } else {
                    iconContent = `<div class="fallback-container">${defaultIconSymbol}</div>`;
                }

                const title = currentLang === 'ar' ? app.nameAr : app.name;
                const category = currentLang === 'ar' ? app.category : app.categoryEn;

                return `
                    <div class="m3-card" onclick="showDetail(${app.id})">
                        <div class="card-thumbnail" style="background: ${app.gradient}; box-shadow: 0 4px 12px ${app.color}40;">
                            ${iconContent}
                        </div>
                        <div class="card-content">
                            <div class="card-title">${title}</div>
                            <div class="card-badge">${category}</div>
                            <div class="card-subtitle">
                                <span class="card-subtitle-item"><span class="material-symbols-rounded">download</span> ${(app.downloads / 1000).toFixed(1)}K</span>
                                <span class="card-subtitle-item"><span class="material-symbols-rounded">folder</span> ${app.size}</span>
                            </div>
                        </div>
                        <div class="card-action">
                            <span class="material-symbols-rounded">download</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- Show Detail ---
        function showDetail(id) {
            const app = appsData.find(a => a.id === id);
            if (!app) return;
            currentApp = app;

            document.getElementById('homeView').style.display = 'none';
            document.getElementById('detailView').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            window.location.hash = `app-${id}`;

            const detailIconBox = document.getElementById('detailIcon');
            detailIconBox.style.background = app.gradient;
            detailIconBox.style.boxShadow = `0 8px 24px ${app.color}50`;

            let iconHtml = '';
            if (app.icon && app.icon !== 'default') {
                iconHtml = `
                    <img src="${app.icon}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="fallback-container" style="display:none;"><span class="material-symbols-rounded fallback-icon">apps</span></div>
                `;
            } else {
                iconHtml = `<div class="fallback-container"><span class="material-symbols-rounded fallback-icon">apps</span></div>`;
            }
            detailIconBox.innerHTML = iconHtml;

            const title = currentLang === 'ar' ? app.nameAr : app.name;
            const category = currentLang === 'ar' ? app.category : app.categoryEn;
            const desc = currentLang === 'ar' ? app.description : app.descriptionEn;
            const features = currentLang === 'ar' ? app.features : app.featuresEn;

            document.getElementById('detailTitle').textContent = title;
            document.getElementById('detailDownloads').textContent = (app.downloads / 1000).toFixed(1) + 'K';
            document.getElementById('detailSize').textContent = app.size;
            document.getElementById('detailVersion').textContent = app.version;
            
            document.getElementById('detailDesc').textContent = desc;
            
            document.getElementById('featureList').innerHTML = features.map(f => `
                <div class="m3-feature-chip">
                    <span class="material-symbols-rounded icon-filled" style="color: #10b981;">check_circle</span>
                    <span>${f}</span>
                </div>
            `).join('');

            document.getElementById('infoFileName').textContent = app.fileName;
            document.getElementById('infoVersion').textContent = app.version;
            document.getElementById('infoCategory').textContent = category;
            document.getElementById('infoSize').textContent = app.size;
        }

        // --- Show Home ---
        function showHome() {
            document.getElementById('detailView').classList.remove('active');
            document.getElementById('homeView').style.display = 'block';
            window.location.hash = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- Download ---
        function downloadApp() {
            if(!currentApp) return;
            const link = document.createElement('a');
            link.href = '../' + currentApp.fileName;
            link.download = currentApp.fileName;
            link.click();
        }

        // Handle back button
        window.addEventListener('popstate', () => {
            if(!window.location.hash) {
                showHome();
            } else if (window.location.hash.startsWith('#app-')) {
                const id = parseInt(window.location.hash.replace('#app-', ''));
                if(id) showDetail(id);
            }
        });
    </script>
</body>
</html>
